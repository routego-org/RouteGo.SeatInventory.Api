# Seat Inventory — seat holds in DynamoDB, 10-minute hold timer
# Source: RouteGo.SeatInventory.Api   Image: routego/seat-inventory   ServiceAccount -> IAM role routego-seat-inventory-pod-role (EKS Pod Identity)
# Settings that differ per AWS account come from ConfigMap routego-environment (RouteGo.Infra/k8s/platform/environment.yaml);
# $(VAR) expands an env var defined above it. Secrets are read by the app from Secrets Manager.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seat-inventory
  labels: { app.kubernetes.io/name: seat-inventory, app.kubernetes.io/part-of: routego }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: seat-inventory }
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: seat-inventory, app.kubernetes.io/part-of: routego }
    spec:
      serviceAccountName: seat-inventory
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654              # the 'app' user of the mcr.microsoft.com/dotnet/aspnet image
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: seat-inventory
          image: routego/seat-inventory      # rewritten to the ECR URL + tag by k8s/kustomization.yaml
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef: { name: routego-environment, key: AWS_REGION }
            - name: AWS_ACCOUNT_ID
              valueFrom:
                configMapKeyRef: { name: routego-environment, key: AWS_ACCOUNT_ID }
            - name: PUBLIC_URL
              valueFrom:
                configMapKeyRef: { name: routego-environment, key: PUBLIC_URL }
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: DOTNET_gcServer          # workstation GC: less memory per pod
              value: "0"
            - name: IdentityIssuer
              value: "$(PUBLIC_URL)"
            - name: IdentityAudience
              value: "routego"
            - name: IdentityJwksUrl
              value: "http://identity/.well-known/jwks.json"
            - name: SeatStoreTableName
              value: "routego-seat-inventory"
            - name: HoldExpiryQueueUrl
              value: "https://sqs.$(AWS_REGION).amazonaws.com/$(AWS_ACCOUNT_ID)/inventory-hold-expiry-q"
            - name: InventoryEventsTopicArn
              value: "arn:aws:sns:$(AWS_REGION):$(AWS_ACCOUNT_ID):routego-inventory-events"
            - name: AuditEventsTopicArn
              value: "arn:aws:sns:$(AWS_REGION):$(AWS_ACCOUNT_ID):routego-audit-events"
            - name: TripScheduledQueueUrl
              value: "https://sqs.$(AWS_REGION).amazonaws.com/$(AWS_ACCOUNT_ID)/inventory-trip-scheduled-q"
            - name: TripScheduledDeadLetterQueueUrl
              value: "https://sqs.$(AWS_REGION).amazonaws.com/$(AWS_ACCOUNT_ID)/inventory-trip-scheduled-dlq"
            - name: TripCancelledQueueUrl
              value: "https://sqs.$(AWS_REGION).amazonaws.com/$(AWS_ACCOUNT_ID)/inventory-trip-cancelled-q"
            - name: TripCancelledDeadLetterQueueUrl
              value: "https://sqs.$(AWS_REGION).amazonaws.com/$(AWS_ACCOUNT_ID)/inventory-trip-cancelled-dlq"
            - name: FareChangedQueueUrl
              value: "https://sqs.$(AWS_REGION).amazonaws.com/$(AWS_ACCOUNT_ID)/inventory-fare-changed-q"
            - name: FareChangedDeadLetterQueueUrl
              value: "https://sqs.$(AWS_REGION).amazonaws.com/$(AWS_ACCOUNT_ID)/inventory-fare-changed-dlq"
            - name: BookingEventsQueueUrl
              value: "https://sqs.$(AWS_REGION).amazonaws.com/$(AWS_ACCOUNT_ID)/inventory-booking-q"
            - name: BookingEventsDeadLetterQueueUrl
              value: "https://sqs.$(AWS_REGION).amazonaws.com/$(AWS_ACCOUNT_ID)/inventory-booking-dlq"
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          startupProbe:              # .NET cold start + first AWS calls; up to 2 minutes
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:            # process up
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 3
